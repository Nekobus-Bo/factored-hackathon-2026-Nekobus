<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pattern Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 320px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 320px; }
  .v { fill: var(--violet); }
  .b { fill: var(--pattern); }
  .f { fill: var(--field); }
  .s { fill: var(--sync); }
  .h { fill: var(--hazard); }
  .hx { fill: none; stroke: var(--line); stroke-width: var(--stroke-hairline, 1px); }
  .cut { fill: none; stroke: var(--surface-000); stroke-width: var(--stroke-hairline, 1px); }
  /* name and tagline in flow, pinned by the block's bottom edge */
  .words { position: absolute; left: var(--space-6, 24px); bottom: var(--space-6, 24px); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: 900; font-stretch: 62.5%; font-size: 120px; line-height: .95; letter-spacing: -.01em; color: var(--ink); }
  .tag { margin: var(--space-2, 8px) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Pattern Blue: violet, blue and deep-field slabs over a hexagonal grid, a green cell and an orange tag">
<!--
  blocks      violet 192×216 bled off the top (largest, the primary action) · pattern blue 144×192 · field 112×256 bled off the right (deep, always dark) · sync-green hex cell 48×56 hanging under the violet slab · hazard tag 72×24 once (it only ever means caution) — ≈32% of 960×320
  arrangement staggered stack: three slabs at different heights sharing one baseline at y=296 (space-6 above the edge) except the violet one, which hangs from the top edge; gutters space-4
  pattern     hexagon field, from "literal motif": 33 hexagons in a 48×56 cell (Pattern Blue is the Angel detection code, and the absolute-field cell is a hexagon); hairline in line on the ground, cut into the slabs in surface-000
  scales      slab sides in space-2 multiples; chamfer cut-lg (12) on one corner of each slab; tag cut-sm; lattice pitch 48 / 42 (space-6 × 2 / space-6 × 1.75)
-->

</div>
<div class="words">
