<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2PromoCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+Display:wdth,wght@62.5..100,100..900&display=swap">
<style>
  .stage { display: flex; justify-content: center; padding: 24px 16px; }

<body>
<div class="stage">
  <aside class="pb-s2" aria-labelledby="s2-title">
    <i class="pb-hexfield" aria-hidden="true"></i>
    <div class="pb-s2__top"><span>Pattern Blue · Cripto</span><span class="pb-s2__demo">Solo demo</span></div>
    <div class="pb-s2__mark"><span class="pb-s2__glyph" aria-hidden="true">S²</span><span class="pb-s2__ticker"><i class="pb-ico pb-ico--infinity" aria-hidden="true"></i> S2</span></div>
    <h2 class="pb-s2__title" id="s2-title">Liquidez<br>sin límite</h2>
    <p class="pb-s2__sub">S² lleva el nombre de un motor de energía infinita: un flujo que nunca se agota.</p>
    <div class="pb-gauge pb-gauge--sm pb-s2__reactor" aria-hidden="true"><div class="pb-gauge__track"><div class="pb-gauge__fill"></div></div></div>
    <p class="pb-s2__legal">Activo digital ficticio de demostración. No es una inversión ni un producto real.</p>
  </aside>
</div>
