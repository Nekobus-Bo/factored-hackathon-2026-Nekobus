</div>
<script>
  (function () {
    var root = document.documentElement;
    // theme toggle: sets data-theme on <html> and keeps every toggle in sync
    function syncTheme() {
      var cur = root.getAttribute('data-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.querySelectorAll('.pb-theme__btn').forEach(function (b) { b.setAttribute('aria-checked', b.getAttribute('data-theme-set') === cur ? 'true' : 'false'); });
    }
    document.querySelectorAll('.pb-theme__btn').forEach(function (b) {
      b.addEventListener('click', function () { root.setAttribute('data-theme', b.getAttribute('data-theme-set')); syncTheme(); });
    });
    syncTheme();
    // language switch (decorative here): keeps every switch in sync
    document.querySelectorAll('.pb-lang__btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var code = b.getAttribute('data-lang');
        document.querySelectorAll('.pb-lang__btn').forEach(function (o) { o.setAttribute('aria-checked', o.getAttribute('data-lang') === code ? 'true' : 'false'); });
      });
    });
    // collapsed menu
    document.querySelectorAll('.pb-nav__menu').forEach(function (m) {
      m.addEventListener('click', function () {
        var nav = m.closest('.pb-nav'), open = nav.getAttribute('data-open') !== 'true';
        nav.setAttribute('data-open', open ? 'true' : 'false');
        m.setAttribute('aria-expanded', open ? 'true' : 'false');
        m.querySelector('.pb-ico').className = 'pb-ico pb-ico--' + (open ? 'x' : 'menu');
      });
    });
    // a tap on a menu link closes the collapsed menu
    document.querySelectorAll('.pb-nav__link').forEach(function (l) {
      l.addEventListener('click', function () {
        var nav = l.closest('.pb-nav'), m = nav.querySelector('.pb-nav__menu');
        nav.setAttribute('data-open', 'false'); m.setAttribute('aria-expanded', 'false');
        m.querySelector('.pb-ico').className = 'pb-ico pb-ico--menu';
      });
    });
    // accordion (single open, collapsible)
    document.querySelectorAll('.pb-faq').forEach(function (faq) {
      var triggers = faq.querySelectorAll('.pb-faq__trigger');
      function set(t, on) {
        t.setAttribute('aria-expanded', on ? 'true' : 'false');
        t.setAttribute('data-state', on ? 'open' : 'closed');
        var c = document.getElementById(t.getAttribute('aria-controls'));
        c.hidden = !on; c.setAttribute('data-state', on ? 'open' : 'closed');
        t.closest('.pb-faq__item').setAttribute('data-state', on ? 'open' : 'closed');
      }
      triggers.forEach(function (t) {
        t.addEventListener('click', function () {
          var wasOpen = t.getAttribute('aria-expanded') === 'true';
          triggers.forEach(function (o) { set(o, false); });
          if (!wasOpen) set(t, true);
        });
      });
    });
  })();
</script>
