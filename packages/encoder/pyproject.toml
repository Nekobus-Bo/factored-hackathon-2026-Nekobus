[project]
name = "encoder"
version = "0.1.0"
description = "Decision and extraction models for Pattern Blue"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "gliner2>=2.0.0",
    "gliner>=0.2.0",
    "peft>=0.10.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
