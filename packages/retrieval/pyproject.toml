[project]
name = "retrieval"
version = "0.1.0"
description = "Retrieval models and adapters for Pattern Blue"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.19.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
