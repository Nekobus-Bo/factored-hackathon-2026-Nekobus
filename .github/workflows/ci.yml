name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Start the stack with no .env (defaults only)
        run: make up

      - name: Smoke
        run: make smoke

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=200

      - name: Stop the stack
        if: always()
        run: make down

  images:
    name: image (${{ matrix.service }}, amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [banking-core, orchestrator, encoder]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build for linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
