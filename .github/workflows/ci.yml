name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Database for the banking-core DB tests. The tests create and migrate their own
    # `bank_test` database on it. Compose's postgres is not published to the host,
    # so this port does not clash with the stack started below. The healthcheck goes
    # over TCP: the image's temporary init server only listens on its socket.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: dev-only-change-me
        ports:
          - 38432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://app:dev-only-change-me@127.0.0.1:38432/bank_test

      - name: Tests (packages outside the root testpaths)
        run: |
          uv run --package evalrunner pytest -q eval/runner
          uv run --package retrieval pytest -q packages/retrieval/tests
          uv run --package calibrate pytest -q tools/calibrate

      - name: Start the stack with no .env (defaults only)
        run: make up

      - name: Smoke
        run: make smoke

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs --tail=200

      - name: Stop the stack
        if: always()
        run: make down

  # The TypeScript side (Bun workspace, ADR-0009). Independent of the Python job: no database, no Docker.
  design-tokens:
    name: design tokens (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Design tokens (dist matches src, typecheck, tests)
        run: make design-tokens-check

      # @pattern-blue/contracts and every apps/web-* package: typecheck and bun test. The contracts
      # tests include the drift test against packages/contracts/schemas.
      - name: Web (contracts and apps, typecheck and tests)
        run: make web-check

  images:
    name: image (${{ matrix.service }}, amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [banking-core, orchestrator, encoder]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build for linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
