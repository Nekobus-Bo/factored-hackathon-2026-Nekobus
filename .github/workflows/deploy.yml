name: deploy

# Builds the five images, pushes them to Artifact Registry and rolls the Cloud Run environment
# out to them (ADR-0015; docs/deployment.md, section 6). Terraform (infra/deploy/gcp) owns
# everything else: this workflow only changes which image each service and job runs.
#
# Never runs for pull_request. workflow_run DOES fire for a fork's PR if the fork's branch
# happens to be named "main" (GitHub matches `branches: [main]` on the *head branch name*,
# regardless of which repo it lives in), so the `build`/`deploy` jobs additionally require, in
# their own `if:`, that the completed run's event was a `push` and its head repository is
# this repository — never a fork. workflow_dispatch is manual and repo-scoped, additionally
# pinned to `refs/heads/main` below. Both jobs also need the repository variable
# DEPLOY_ENABLED=true, so a fork or a copy without a GCP environment does nothing.
#
# GitHub holds no GCP secret: the jobs log in with GitHub's OIDC token through Workload
# Identity Federation, which accepts only this repository's id, main and this file
# (infra/deploy/gcp/ci.tf). The variables come from `make gcp-gh-vars`.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to deploy without rebuilding, e.g. sha-abc1234 (rollback). Empty = build from main."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ vars.GCP_PROJECT_ID || github.repository }}
  cancel-in-progress: false

jobs:
  build:
    # Skipped on a rollback dispatch (an image_tag was given): what is already in the registry
    # is deployed as it is.
    if: |
      vars.DEPLOY_ENABLED == 'true'
      && (
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.image_tag == ''
        )
      )
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [banking-core, orchestrator, encoder, web-client, web-backoffice]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # banking-core without extras: its embeddings come from the model server, so PyTorch
      # stays out of the trusted zone's image. The encoder gets the embed and hf extras (the
      # fine-tuned DistilBERT's weights come in by digest from its Dockerfile, ADR-0014) and
      # bakes in the embedding model pinned in .env.example; the build fails if the weights
      # do not match the hash.
      - id: build-args
        run: |
          pin() { sed -n "s/^$1=//p" .env.example | tail -n 1; }
          {
            echo "value<<BUILD_ARGS"
            case "${{ matrix.service }}" in
              banking-core) echo "BANKING_CORE_SYNC_ARGS=" ;;
              encoder)
                echo "ENCODER_EXTRAS=embed hf"
                echo "EMBEDDING_MODEL=$(pin EMBEDDING_MODEL)"
                echo "EMBEDDING_REVISION=$(pin EMBEDDING_REVISION)"
                echo "EMBEDDING_WEIGHTS_SHA256=$(pin EMBEDDING_WEIGHTS_SHA256)"
                ;;
            esac
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Cloud Run runs linux/amd64 only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.build-args.outputs.value }}
          tags: ${{ vars.GCP_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=deploy-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.service }}

  deploy:
    name: deploy
    needs: [build]
    # `needs.build.result == 'skipped'` alone is NOT a valid stand-in for "the security check
    # passed": build is also skipped when its own `if:` blocks it (a workflow_run from a fork
    # whose branch happens to be named main). So the same source/branch predicate from the
    # `build` job is re-derived here independently, rather than trusted via needs.build.result.
    if: |
      always()
      && vars.DEPLOY_ENABLED == 'true'
      && (
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
          && needs.build.result == 'success'
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && (needs.build.result == 'success' || needs.build.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.image_tag }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_PREFIX: ${{ vars.GCP_NAME_PREFIX }}
      GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
      # "true" reloads the synthetic demo customers on every deploy: it TRUNCATES the banking
      # tables and empties the handoff queue (docs/deployment.md, section 7).
      DEMO_SEED: ${{ vars.DEMO_SEED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            infra/deploy/gcp

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # In dependency order. `services update` waits for the new revision to pass its startup
      # probe; if it does not, the command fails and traffic stays on the previous revision.
      - name: Roll out
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAG" || { echo "no image tag to deploy" >&2; exit 1; }
          image() { echo "$GCP_REGISTRY/$1:$IMAGE_TAG"; }
          gc() { gcloud "$@" --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet; }

          # 1. The model server first: banking-core's /ready builds its index through it.
          gc run services update "$GCP_PREFIX-encoder" --image "$(image encoder)"

          # 2. Migrations before banking-core serves the new schema; the jobs follow the images.
          gc run jobs update "$GCP_PREFIX-migrate" --image "$(image banking-core)"
          gc run jobs execute "$GCP_PREFIX-migrate" --wait
          gc run jobs update "$GCP_PREFIX-seed" --image "$(image banking-core)"
          gc run jobs update "$GCP_PREFIX-netcheck" --image "$(image orchestrator)"
          if [ "$DEMO_SEED" = "true" ]; then
            gc run jobs execute "$GCP_PREFIX-seed" --wait
          fi

          # 3. The trusted zone, the orchestrator, then the front ends.
          for service in banking-core orchestrator web-client web-backoffice; do
            gc run services update "$GCP_PREFIX-$service" --image "$(image "$service")"
          done

      - name: Smoke (positive and negative checks, and the network check)
        run: NETCHECK=1 bash infra/deploy/gcp/smoke.sh

      - name: Logs on failure
        if: failure()
        run: |
          gcloud logging read \
            'resource.type=("cloud_run_revision" OR "cloud_run_job") AND severity>=WARNING' \
            --project "$GCP_PROJECT" --freshness 30m --limit 100 \
            --format 'value(timestamp, resource.labels.service_name, resource.labels.job_name, textPayload)' || true
