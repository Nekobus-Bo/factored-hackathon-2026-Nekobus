name: deploy

# Never runs for pull_request. workflow_run DOES fire for a fork's PR if the
# fork's branch happens to be named "main" (GitHub matches `branches: [main]`
# on the *head branch name*, regardless of which repo it lives in), so the
# `build`/`deploy` jobs additionally require, in their own `if:`, that the
# completed run's event was a `push` and its head repository is this
# repository — never a fork — before touching any secret. workflow_dispatch
# is manual and repo-scoped, additionally pinned to `refs/heads/main` below.
# A fork that has not set the repository variable DEPLOY_ENABLED=true gets a
# clean no-op from the `deploy` job's `if:`, so this file works unmodified
# after a fork (it still builds and pushes to the fork owner's own GHCR
# packages, since that part needs no configuration).
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to deploy to (default: vars.DEPLOY_ENVIRONMENT, else test-vps)"
        required: false
        type: string
      image_tag:
        description: "Existing GHCR tag to deploy without rebuilding, e.g. sha-abc1234 (rollback). Empty = build from the triggering commit."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || vars.DEPLOY_ENVIRONMENT || 'test-vps' }}
  cancel-in-progress: false

jobs:
  build:
    # Skipped on a rollback dispatch (an image_tag was given): reuses what's
    # already in GHCR instead of rebuilding and re-tagging it.
    #
    # Both branches below require the code being built to actually be this
    # repository's own main branch: workflow_dispatch is pinned to
    # refs/heads/main, and workflow_run additionally checks the *triggering*
    # event was a push (not e.g. a fork's pull_request) and that the run's
    # head repository is this repository, not a fork whose branch happens to
    # be named "main" (branches: [main] above matches on branch name alone,
    # across repos).
    if: |
      (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.conclusion == 'success'
      )
      || (
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
        && inputs.image_tag == ''
      )
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [banking-core, orchestrator, encoder]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: owner
        run: echo "lower=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: build-args
        run: |
          case "${{ matrix.service }}" in
            banking-core) echo "value=BANKING_CORE_SYNC_ARGS=${{ vars.BANKING_CORE_SYNC_ARGS || '--extra vector' }}" >> "$GITHUB_OUTPUT" ;;
            encoder)      echo "value=ENCODER_EXTRAS=${{ vars.ENCODER_EXTRAS || '' }}" >> "$GITHUB_OUTPUT" ;;
            *)            echo "value=" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: contains(vars.DEPLOY_PLATFORMS || 'linux/amd64', 'arm64')

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: ${{ vars.DEPLOY_PLATFORMS || 'linux/amd64' }}
          push: true
          build-args: ${{ steps.build-args.outputs.value }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/pattern_blue-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.lower }}/pattern_blue-${{ matrix.service }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy
    needs: [build]
    # DEPLOY_ENABLED must be a REPOSITORY variable, not an environment
    # variable: this `if:` is evaluated before the job's `environment:` binds,
    # so an environment-scoped vars.DEPLOY_ENABLED would not be visible here
    # yet and the job would silently skip forever. A fork with no deploy
    # configuration (DEPLOY_ENABLED unset at the repo level) gets a clean
    # no-op instead of a failure.
    #
    # `needs.build.result == 'skipped'` alone is NOT a valid stand-in for "the
    # security check passed": build is also skipped when its own `if:` blocks
    # it (a workflow_run from a fork whose branch happens to be named main),
    # and a skipped job still counts as skipped either way. So the same
    # source/branch predicate from the `build` job is re-derived here
    # independently, rather than trusted via needs.build.result.
    if: |
      always()
      && vars.DEPLOY_ENABLED == 'true'
      && (
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
          && needs.build.result == 'success'
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && (needs.build.result == 'success' || needs.build.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || vars.DEPLOY_ENVIRONMENT || 'test-vps' }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.image_tag }}
      DATA_MODE: ${{ vars.DATA_MODE || 'host' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            infra/compose

      - id: owner
        run: |
          echo "lower=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: SSH key and pinned known_hosts
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          {
            echo "Host deploy-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
          } >> ~/.ssh/config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Copy compose files
        run: |
          ssh deploy-target "mkdir -p '$DEPLOY_PATH/infra/compose'"
          scp infra/compose/docker-compose.yml infra/compose/docker-compose.prod.yml infra/compose/docker-compose.bundled.yml \
            "deploy-target:$DEPLOY_PATH/infra/compose/"

      - name: Write server .env (never echoed; file mode 600)
        # None of these secret values may contain a literal `$`: Compose
        # interpolates variables when it reads --env-file, so a raw `$` in a
        # secret is read as the start of a (likely undefined) reference and
        # silently mangled, not passed through. Use `$$` if a `$` is
        # unavoidable, same convention as MASTER_KEY/BLIND_INDEX_SALT in
        # .env.example.
        run: |
          {
            echo "APP_ENV=production"
            echo "REGISTRY=$REGISTRY"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_CORE_URL=$REDIS_CORE_URL"
            echo "REDIS_EDGE_URL=$REDIS_EDGE_URL"
            echo "SESSION_SECRET=$SESSION_SECRET"
            echo "MASTER_KEY=$MASTER_KEY"
            echo "BLIND_INDEX_SALT=$BLIND_INDEX_SALT"
            echo "ADMIN_API_ENABLED=${ADMIN_API_ENABLED:-false}"
            echo "ADMIN_API_TOKEN=$ADMIN_API_TOKEN"
            echo "LLM_MODE=${LLM_MODE:-replay}"
            echo "LLM_API_KEY=$LLM_API_KEY"
            echo "LLM_BASE_URL=$LLM_BASE_URL"
            echo "LLM_MODEL=$LLM_MODEL"
            if [ "$DATA_MODE" = "bundled" ]; then
              echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
              echo "REDIS_CORE_PASSWORD=$REDIS_CORE_PASSWORD"
              echo "REDIS_EDGE_PASSWORD=$REDIS_EDGE_PASSWORD"
            fi
          } | ssh deploy-target "umask 077 && cat > '$DEPLOY_PATH/.env'"
        env:
          REGISTRY: ${{ steps.owner.outputs.registry }}
          # Required in every mode.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_CORE_URL: ${{ secrets.REDIS_CORE_URL }}
          REDIS_EDGE_URL: ${{ secrets.REDIS_EDGE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          BLIND_INDEX_SALT: ${{ secrets.BLIND_INDEX_SALT }}
          # Optional: only meaningful when the corresponding feature is on.
          ADMIN_API_ENABLED: ${{ vars.ADMIN_API_ENABLED }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LLM_MODE: ${{ vars.LLM_MODE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Only required, and only written, when DATA_MODE=bundled.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_CORE_PASSWORD: ${{ secrets.REDIS_CORE_PASSWORD }}
          REDIS_EDGE_PASSWORD: ${{ secrets.REDIS_EDGE_PASSWORD }}

      - name: Pull, migrate, deploy
        run: |
          COMPOSE_FILES="-f $DEPLOY_PATH/infra/compose/docker-compose.yml -f $DEPLOY_PATH/infra/compose/docker-compose.prod.yml"
          PROFILE_FLAG=""
          if [ "$DATA_MODE" = "bundled" ]; then
            COMPOSE_FILES="$COMPOSE_FILES -f $DEPLOY_PATH/infra/compose/docker-compose.bundled.yml"
            PROFILE_FLAG="--profile bundled-data"
          fi
          COMPOSE_CMD="env COMPOSE_PROJECT_NAME=pattern-blue docker compose $PROFILE_FLAG $COMPOSE_FILES --env-file $DEPLOY_PATH/.env"
          ssh deploy-target "$COMPOSE_CMD pull"
          ssh deploy-target "$COMPOSE_CMD run --rm migrate"
          ssh deploy-target "$COMPOSE_CMD up -d --wait"

      - name: Smoke (orchestrator /health on the server, 127.0.0.1-bound)
        run: |
          ssh deploy-target "curl -fsS --max-time 5 http://127.0.0.1:\${PORT_ORCHESTRATOR:-8080}/health"

      - name: Logs on failure
        if: failure()
        run: |
          COMPOSE_FILES="-f $DEPLOY_PATH/infra/compose/docker-compose.yml -f $DEPLOY_PATH/infra/compose/docker-compose.prod.yml"
          PROFILE_FLAG=""
          if [ "$DATA_MODE" = "bundled" ]; then
            COMPOSE_FILES="$COMPOSE_FILES -f $DEPLOY_PATH/infra/compose/docker-compose.bundled.yml"
            PROFILE_FLAG="--profile bundled-data"
          fi
          ssh deploy-target "env COMPOSE_PROJECT_NAME=pattern-blue docker compose $PROFILE_FLAG $COMPOSE_FILES --env-file $DEPLOY_PATH/.env logs --tail=200" || true
