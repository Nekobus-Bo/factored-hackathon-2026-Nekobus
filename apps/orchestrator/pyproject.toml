[project]
name = "orchestrator"
version = "0.1.0"
description = "Orchestrator service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "litellm>=1.102.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
contracts = { workspace = true }

[dependency-groups]
dev = [
    "fakeredis>=2.20.0",
    "respx>=0.23.1",
]
