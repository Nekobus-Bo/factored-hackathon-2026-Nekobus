[project]
name = "banking-core"
version = "0.1.0"
description = "Banking Core service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "contracts",
    "cryptography>=43.0.0",
    "faker>=20.0.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "retrieval",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Dense kb.search backend (the configured default). Without it, only an
# explicitly configured BM25 backend works; vector fails loudly.
vector = ["retrieval[vector]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_core"]
