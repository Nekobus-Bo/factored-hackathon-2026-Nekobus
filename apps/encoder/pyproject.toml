[project]
name = "encoder-service"
version = "0.1.0"
description = "Encoder service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/encoder_service"]

[tool.uv.sources]
contracts = { workspace = true }
