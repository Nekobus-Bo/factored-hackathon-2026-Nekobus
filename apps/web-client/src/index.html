<script>
  // Apply a remembered theme before the stylesheet paints, so a dark page does not flash light.
  // The global machine takes over once the bundle loads. Storage may be blocked: every access is guarded.
  (function () {
    try {
      var theme = window.localStorage.getItem("pb-theme");
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    } catch (error) {}
  })();
</script>
