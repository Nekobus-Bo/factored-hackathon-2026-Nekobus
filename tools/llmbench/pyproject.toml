[project]
name = "llmbench"
version = "0.1.0"
description = "Sandbox testbench for conversational LLMs against the real turn engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orchestrator",
    "banking-core",
    "contracts",
    "evalrunner",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
llmbench = "llmbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
