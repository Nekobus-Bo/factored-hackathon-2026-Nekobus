id: clarify_en
lang: en
skill: clarify
description: 'A vague opener: ask what the customer needs; no write and no identity tool on a guess.'
setup:
  customer: demo_en
prefix: []
probe:
  user: Hi, I have a problem with my card.
  expect:
    decision:
    - null
    - kb.search
    forbid:
    - card.block
    - card.list
    - transaction.list_recent
    - account.get_summary
    - otp.verify
    - customer.match
    - otp.send
    - handoff.create
    reply:
      question: true
