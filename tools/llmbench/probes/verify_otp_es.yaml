id: verify_otp_es
lang: es
skill: verify_otp
description: 'The customer types the code: otp.verify with the [OTP_n] placeholder, never a literal guess.'
setup:
  customer: demo_es
prefix:
- user: Hola, perdí mi tarjeta débito hace un rato. Mi cédula es 1020304050.
  calls:
  - tool: customer.match
    args:
      document_type: NATIONAL_ID
      document_number: '{{ph:DOC}}'
  - tool: otp.send
  reply: Te envié un código de 6 dígitos a d***@example.com. ¿Me lo compartes?
probe:
  user: El código es {{otp}}
  expect:
    decision:
    - otp.verify
    require:
      otp.verify:
        code: re:^\[OTP_\d+\]$
    forbid:
    - card.block
    - customer.match
    max_proposals:
      otp.verify: 1
