id: dispute_handoff_en
lang: en
skill: dispute_handoff
description: 'After the block the customer wants the charge disputed: handoff.create to DISPUTES (a human
  decides, not the model).'
setup:
  customer: demo_en
prefix:
- user: Hi, there is a charge on my card I don't recognize. My passport number is P12345678.
  calls:
  - tool: customer.match
    args:
      document_type: PASSPORT
      document_number: '{{ph:DOC}}'
  - tool: otp.send
  reply: I sent a 6-digit code to d***@example.com. Could you share it with me?
- user: '{{otp}}'
  calls:
  - tool: otp.verify
    args:
      code: '{{ph:OTP}}'
  - tool: transaction.list_recent
  - tool: card.block
    args:
      card_ref: '{{card}}'
      reason: UNRECOGNIZED_CHARGE
      transaction_id: '{{tx:Global Electronics}}'
  reply: I blocked your card ending in 1070 to stop new charges.
probe:
  user: Thanks. I also want to dispute that Global Electronics charge, I want my money back.
  expect:
    decision:
    - handoff.create
    - kb.search
    require:
      handoff.create:
        department: DISPUTES
        reason:
        - DISPUTE_CLAIM
        - UNRECOGNIZED_TRANSACTION
    forbid:
    - card.block
