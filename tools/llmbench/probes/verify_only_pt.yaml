id: verify_only_pt
lang: pt
skill: verify_only
description: '''Verify my identity'' with the document and no other goal: customer.match, then otp.send;
  verifying means the code.'
setup:
  customer: demo_pt
prefix: []
probe:
  user: Oi, quero verificar minha identidade. Meu CPF é 12345678900.
  expect:
    decision:
    - customer.match
    require:
      customer.match:
        document_number: re:^\[DOC_\d+\]$
      otp.send: {}
    forbid:
    - card.block
    - card.list
    - transaction.list_recent
    - account.get_summary
    - otp.verify
