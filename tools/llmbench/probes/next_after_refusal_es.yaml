id: next_after_refusal_es
lang: es
skill: next_after_refusal
description: 'Identified, and card.list was refused for the state: on ''what now?'' send the code instead
  of relaying the refusal again or retrying.'
setup:
  customer: demo_es
prefix:
- user: Hola, perdí mi tarjeta débito hace un rato. Mi cédula es 1020304050.
  calls:
  - tool: customer.match
    args:
      document_type: NATIONAL_ID
      document_number: '{{ph:DOC}}'
  - tool: card.list
  expect_refused:
  - card.list
  reply: Ya te identifiqué, pero no puedo consultar tus tarjetas en el estado actual de verificación.
probe:
  user: ¿Y entonces qué hago? Necesito bloquearla ya.
  expect:
    decision:
    - otp.send
    forbid:
    - card.block
    - card.list
    - transaction.list_recent
    - account.get_summary
    - otp.verify
    - customer.match
