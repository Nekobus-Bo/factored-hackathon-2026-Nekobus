id: verify_only_es
lang: es
skill: verify_only
description: '''Verify my identity'' with the document and no other goal: customer.match, then otp.send;
  verifying means the code.'
setup:
  customer: demo_es
prefix: []
probe:
  user: Hola, quiero verificar mi identidad. Mi cédula es 1020304050.
  expect:
    decision:
    - customer.match
    require:
      customer.match:
        document_number: re:^\[DOC_\d+\]$
      otp.send: {}
    forbid:
    - card.block
    - card.list
    - transaction.list_recent
    - account.get_summary
    - otp.verify
