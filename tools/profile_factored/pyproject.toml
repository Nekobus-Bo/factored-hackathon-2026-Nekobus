[project]
name = "profile-factored"
version = "0.1.0"
description = "Aggregate-only profiler for the Factored dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0.0",
]

[project.scripts]
profile-factored = "profile_factored.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
