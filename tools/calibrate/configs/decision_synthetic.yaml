# Zero-shot decision calibration on the real synthetic splits.
# The test split is provisional synthetic (not human) until
# data/eval/synthetic/decision.test.jsonl exists; see data/eval/synthetic/README.md.
task: decision
mode: zeroshot
data_paths:
  - data/eval/synthetic/decision.train.jsonl
  - data/eval/synthetic/decision.validation.jsonl
  - data/eval/synthetic/decision.test.provisional.jsonl
p_min: 0.9
languages:
  - es
  - pt
  - en
candidates:
  - name: tfidf_lr_baseline
    type: tfidf_lr
    model_id: tfidf_lr
  - name: gliner2.5_multi
    type: gliner
    model_id: fastino/gliner2.5-multi-v1
