task: embedding
mode: zeroshot
kb_path: packages/retrieval/kb/snippets.jsonl
queries_path: data/eval/synthetic/retrieval/queries.jsonl
# The synthetic query set is a validation split; test is reserved for humans.
eval_split: validation
k_list:
  - 1
  - 3
  - 5
languages:
  - es
  - pt
  - en
# ADR-0006 amendment 2026-10-01: granite-311m replaces MiniLM for kb.search. The
# harness loads each model's default branch: on 2026-10-01 that is MiniLM e8f8c211
# (the transformers v5 tokenizer fix) and Granite 44399559 (the pinned revision).
candidates:
  - name: bm25_baseline
    type: bm25
    model_id: bm25
  - name: paraphrase_multilingual_minilm
    type: sentence_transformers
    model_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  - name: granite_311m
    type: sentence_transformers
    model_id: ibm-granite/granite-embedding-311m-multilingual-r2
    dtype: float32
