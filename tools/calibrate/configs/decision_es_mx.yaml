# Zero-shot decision calibration on the es-MX dataset grounded in Mexican app reviews
# (tools/synthdata_regional). The splits are local only (data/staging is not versioned):
# build them with `make synth-data-regional LOCALE=...` and `make build-test-regional LOCALE=...`.
# Train/validation are LLM-generated and the test split is provisional synthetic (not human).
task: decision
mode: zeroshot
data_paths:
  - data/staging/decision_es_mx/decision.es_mx.train.jsonl
  - data/staging/decision_es_mx/decision.es_mx.validation.jsonl
  - data/staging/decision_es_mx/decision.es_mx.test.provisional.jsonl
p_min: 0.9
languages:
  - es
candidates:
  - name: tfidf_lr_baseline
    type: tfidf_lr
    model_id: tfidf_lr
