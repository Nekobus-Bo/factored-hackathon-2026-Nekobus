[project]
name = "calibrate"
version = "0.1.0"
description = "Calibration harness for decision and embedding models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "encoder[gliner]",
    "retrieval[vector,train]",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[project.scripts]
calibrate = "calibrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
