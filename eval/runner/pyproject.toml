[project]
name = "evalrunner"
version = "0.1.0"
description = "Evaluation runner core for Pattern Blue conversational scenarios"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "contracts",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
evalrunner = "evalrunner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalrunner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
