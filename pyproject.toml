[project]
name = "pattern-blue"
version = "0.1.0"
description = "AI-first customer service system for banking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "banking-core",
    "orchestrator",
    "encoder-service",
    "contracts",
    "evalrunner",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/banking-core",
    "apps/orchestrator",
    "apps/encoder",
    "packages/contracts",
    "packages/encoder",
    "packages/retrieval",
    "tools/calibrate",
    "eval/runner",
    "tools/profile_factored",
]

[tool.uv.sources]
encoder = { workspace = true }
retrieval = { workspace = true }
banking-core = { workspace = true }
orchestrator = { workspace = true }
encoder-service = { workspace = true }
contracts = { workspace = true }
evalrunner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "fakeredis>=2.20.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages/contracts/tests", "packages/retrieval/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []
