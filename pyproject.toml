[project]
name = "pattern-blue"
version = "0.1.0"
description = "AI-first customer service system for banking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "banking-core",
    "orchestrator",
    "encoder-service",
    "contracts",
    "evalrunner",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/banking-core",
    "apps/orchestrator",
    "apps/encoder",
    "packages/contracts",
    "packages/encoder",
    "packages/retrieval",
    "tools/calibrate",
    "eval/runner",
    "tools/profile_factored",
    "tools/llmbench",
]

[tool.uv.sources]
encoder = { workspace = true }
retrieval = { workspace = true }
banking-core = { workspace = true }
orchestrator = { workspace = true }
encoder-service = { workspace = true }
contracts = { workspace = true }
evalrunner = { workspace = true }
llmbench = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "fakeredis>=2.20.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages/contracts/tests", "packages/encoder/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 88
# lab/ is the exploratory sandbox, a separate uv project of marimo notebooks (whose
# cells end in bare expressions on purpose); it is not shipped code.
extend-exclude = ["lab"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Long lines here are LLM prompt text and es/pt seed phrases, kept unwrapped so they
# read as the prompt the model sees.
"tools/synthdata_regional/**" = ["E501"]
