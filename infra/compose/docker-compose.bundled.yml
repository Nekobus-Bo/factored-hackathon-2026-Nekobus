# Bundled-data strictness. Layer on top of the other two, and only together
# with --profile bundled-data (otherwise postgres/redis-core/redis-edge never
# start and this file has nothing to attach to):
#
#   docker compose --profile bundled-data \
#                  -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml \
#                  -f infra/compose/docker-compose.bundled.yml up -d --wait
#
# Kept separate from docker-compose.prod.yml so host-data mode (the default)
# never has to interpolate these three passwords: Compose validates a
# service's required (":?") variables during `config`/`up` even when a
# profile keeps that service from starting, so putting them in prod.yml
# directly made plain host-mode deploys fail before this file existed.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis-core:
    environment:
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD:?set REDIS_CORE_PASSWORD}

  redis-edge:
    environment:
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:?set REDIS_EDGE_PASSWORD}
