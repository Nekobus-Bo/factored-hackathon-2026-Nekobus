# Production override. Layer it on the dev file:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml config   # host data
#   docker compose --profile bundled-data \
#                  -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml \
#                  -f infra/compose/docker-compose.bundled.yml config   # bundled data
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml up -d --wait
#
# Host Postgres/Redis are the default. Set DATABASE_URL, REDIS_CORE_URL, and
# REDIS_EDGE_URL. Containerized data services are available only by profile,
# and only by also layering docker-compose.bundled.yml (see that file): this
# file alone does not require their passwords, so host mode never needs them.
# Prebuilt images from a registry; no development defaults for app secrets.
# Published (on loopback, for the ingress or a tunnel): the orchestrator and the customer
# web client. The back office is NOT published (ADR-0013): it is reachable only from the
# compose networks, and needs ADMIN_API_TOKEN, AGENT_API_TOKEN, DEMO_AGENT_PASSWORD and
# BACKOFFICE_SESSION_SECRET to be set (docs/deployment.md). App roots are read-only.

x-app-readonly: &app-readonly
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    profiles: ["bundled-data"]

  redis-core:
    profiles: ["bundled-data"]

  redis-edge:
    profiles: ["bundled-data"]

  migrate:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ""
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override []
    restart: "no"

  seed:
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ""
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:?set BLIND_INDEX_SALT}
    extra_hosts: ["host.docker.internal:host-gateway"]
    # The base file bind-mounts the repo's data/ and reports/ for the local seed.
    # A server has no source tree: docker would create those paths root-owned and
    # the image's user could not write the synthetic dataset the seed generates
    # (deterministically) on each run. Scratch space instead.
    volumes: !override []
    tmpfs:
      - /app/data
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    restart: "no"

  banking-core:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_CORE_URL:?set REDIS_CORE_URL}
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:?set BLIND_INDEX_SALT}
      OTP_CHANNEL_MODE: ${OTP_CHANNEL_MODE:-simulated}
      # The base file defaults the admin API to on with a public development
      # token. Production never inherits that: each feature is switched on
      # explicitly (docs/deployment.md, "Presentation environment").
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    ports: !reset []
  orchestrator:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-orchestrator:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      REDIS_URL: ${REDIS_EDGE_URL:?set REDIS_EDGE_URL}
      REDIS_PASSWORD: ""
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # Conversations one client address may open per hour. The base file's default
      # is generous, for local development and evaluation runs from one address;
      # a public environment keeps 30, whatever the base file says.
      RATE_LIMIT_CONVERSATIONS_PER_IP_HOUR: ${RATE_LIMIT_CONVERSATIONS_PER_IP_HOUR:-30}
      # The base file enables the agent API with a public development token.
      # Production never inherits that: the orchestrator would refuse to start.
      # Switch it on explicitly, with a secret of your own.
      AGENT_API_ENABLED: ${AGENT_API_ENABLED:-false}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override
      banking-core:
        condition: service_healthy
      encoder:
        condition: service_healthy

  encoder:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-encoder:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
    ports: !reset []

  # The customer path: the browser talks to this BFF, which forwards the four chat routes
  # to the orchestrator. It holds no secret. The base file publishes its port on loopback.
  web-client:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-web-client:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production

  # The agent back office. No `ports`: nothing outside the compose networks reaches it, and
  # it holds the two API tokens. To use it, put its own login behind a reverse proxy on
  # the same network, or publish it on loopback with an override file and tunnel to it
  # (docs/deployment.md, "The front ends"). The server refuses to start under
  # APP_ENV=production with a development password, secret or token; an unset value here is
  # a compose error instead of a container that exits.
  web-backoffice:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/pattern_blue-web-backoffice:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:?set DEMO_AGENT_PASSWORD}
      BACKOFFICE_SESSION_SECRET: ${BACKOFFICE_SESSION_SECRET:?set BACKOFFICE_SESSION_SECRET}
    ports: !reset []
