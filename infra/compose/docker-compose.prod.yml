# Production override. Layer it on the dev file:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml config   # host data
#   docker compose --profile bundled-data \
#                  -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml config   # bundled data
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml up -d --wait
#
# Host Postgres/Redis are the default. Set DATABASE_URL, REDIS_CORE_URL, and
# REDIS_EDGE_URL. Containerized data services are available only by profile.
# Prebuilt images from a registry; no development defaults for app secrets.
# Nothing is published except the orchestrator. App roots are read-only.

x-app-readonly: &app-readonly
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    profiles: ["bundled-data"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis-core:
    profiles: ["bundled-data"]
    environment:
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD:?set REDIS_CORE_PASSWORD}

  redis-edge:
    profiles: ["bundled-data"]
    environment:
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:?set REDIS_EDGE_PASSWORD}

  migrate:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ""
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override []
    restart: "no"

  seed:
    image: ${REGISTRY:?set REGISTRY}/banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ""
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:?set BLIND_INDEX_SALT}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    restart: "no"

  banking-core:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_CORE_URL:?set REDIS_CORE_URL}
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:?set BLIND_INDEX_SALT}
      OTP_CHANNEL_MODE: ${OTP_CHANNEL_MODE:-simulated}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    ports: !reset []
  orchestrator:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/orchestrator:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      REDIS_URL: ${REDIS_EDGE_URL:?set REDIS_EDGE_URL}
      REDIS_PASSWORD: ""
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: !override
      banking-core:
        condition: service_healthy
      encoder:
        condition: service_healthy

  encoder:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/encoder:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
    ports: !reset []
