# Production override. Layer it on the dev file:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml config   # preview
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml up -d --wait
#
# Differences from dev:
#   - Prebuilt images from a registry (same images as dev, per docs/runbook.md).
#   - No development defaults for secrets: unset means the command fails.
#   - Nothing is published except the orchestrator.
#   - Root filesystem read-only on the app containers.

x-app-readonly: &app-readonly
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis-core:
    environment:
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD:?set REDIS_CORE_PASSWORD}

  redis-edge:
    environment:
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:?set REDIS_EDGE_PASSWORD}

  migrate:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: "no"

  seed:
    image: ${REGISTRY:?set REGISTRY}/banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:?set BLIND_INDEX_SALT}
    restart: "no"

  banking-core:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/banking-core:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD:?set REDIS_CORE_PASSWORD}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:?set BLIND_INDEX_SALT}
      OTP_CHANNEL_MODE: ${OTP_CHANNEL_MODE:-simulated}
    ports: !reset []

  orchestrator:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/orchestrator:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:?set REDIS_EDGE_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}

  encoder:
    <<: *app-readonly
    image: ${REGISTRY:?set REGISTRY}/encoder:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    environment:
      APP_ENV: production
    ports: !reset []
