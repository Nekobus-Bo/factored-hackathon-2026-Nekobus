# Development stack. Works with NO .env: every variable has a default.
#
#   make up          # from the repo root
#
# Trust boundary (ADR-0004): environment is declared per service. Database
# credentials and cryptographic keys go ONLY to banking-core. Do not replace
# this with a shared `env_file: .env`.
#
# Build context is the repo root: apps are uv workspace members and import
# packages/*, which are not reachable from apps/<name>/.
#
# In-container ports are fixed (8080 / 8081 / 8090); PORT_* only moves the host
# side. Host ports bind to loopback: the internal API is not for the LAN.
#
# Network isolation (ADR-0004, ADR-0006 amendment):
#   core  internal, no egress: postgres, redis-core, banking-core, migrate
#   edge  orchestrator, encoder, redis-edge, banking-core, web-client, web-backoffice
# banking-core is the only service on both. The orchestrator has no network path
# to postgres or redis-core, and neither has a front end. One Redis per trust zone,
# each with a password.
#
# The front ends (ADR-0013) are Bun servers, each with a same-origin BFF: the browser
# talks only to them. web-client forwards the four chat routes to the orchestrator and
# holds no secret. web-backoffice calls the banking-core admin API and the orchestrator
# agent API with ADMIN_API_TOKEN and AGENT_API_TOKEN, which are the same variables with
# the same development defaults as on those two services, so the tokens match with no
# .env. Both are built from the repo root (see their Dockerfile.dockerignore) and are
# published on loopback, like every other port here.
#
# The encoder is the model server (ADR-0012, Appendix J): it serves the decision model
# (/v1/analyze) and the embedding model (/v1/embed) and receives raw customer text, so it
# stays inside this private network. banking-core reaches it at MODEL_SERVER_URL for
# kb.search. To run it on its own host, point MODEL_SERVER_URL and ENCODER_URL there.
#
# postgres and the Redis instances are not published to the host on purpose (they
# collide with local installs). Use `docker compose exec postgres psql -U app bank`.

# Several copies at once: set COMPOSE_PROJECT_NAME (overrides `name:` below) and
# the PORT_* variables. Image tags are project-scoped so copies do not overwrite
# each other's builds.
name: pattern-blue

x-app-healthcheck: &app-healthcheck
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 20s

x-app-hardening: &app-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../infra/db:/docker-entrypoint-initdb.d:ro
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  redis-core:
    <<: *app-hardening
    image: redis:7-alpine
    user: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD:-dev-only-regenerate-core-redis}
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  redis-edge:
    <<: *app-hardening
    image: redis:7-alpine
    user: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:-dev-only-regenerate-edge-redis}
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  migrate:
    <<: *app-hardening
    build: &banking-core-build
      context: ../..
      dockerfile: apps/banking-core/Dockerfile
      args:
        # Only EMBEDDING_BACKEND=local needs it (in-process model, tests and local
        # development). The default embeds through the model server, and nothing in
        # banking-core imports torch then; "" builds a smaller image (ADR-0012, J.6).
        BANKING_CORE_SYNC_ARGS: ${BANKING_CORE_SYNC_ARGS---extra vector}
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/banking-core:dev
    command: ["alembic", "-c", "apps/banking-core/alembic.ini", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core]
    restart: "no"

  seed:
    <<: *app-hardening
    build: *banking-core-build
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/banking-core:dev
    command: ["python", "-m", "banking_core.seed.cli", "seed"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      MASTER_KEY: ${MASTER_KEY:-dev-only-regenerate-this-key}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:-dev-only-regenerate-this-salt}
      APP_ENV: ${APP_ENV:-development}
      INGEST_MAX_CUSTOMERS: ${INGEST_MAX_CUSTOMERS:-5000}
      INGEST_ANCHOR_DATE: ${INGEST_ANCHOR_DATE:-}
    volumes:
      - ../../data:/app/data
      - ../../reports:/app/reports
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [core]
    restart: "no"
    profiles: ["tools", "seed"]

  banking-core:
    <<: *app-hardening
    build: *banking-core-build
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/banking-core:dev
    environment:
      PORT: "8081"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      REDIS_HOST: redis-core
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD:-dev-only-regenerate-core-redis}
      REDIS_URL: ${REDIS_CORE_URL:-}
      REDIS_SESSION_KEY_PREFIX: ${REDIS_SESSION_KEY_PREFIX:-session:}
      REDIS_OTP_CHALLENGE_KEY_PREFIX: ${REDIS_OTP_CHALLENGE_KEY_PREFIX:-otp:challenge:}
      REDIS_OTP_INBOX_KEY_PREFIX: ${REDIS_OTP_INBOX_KEY_PREFIX:-otp:inbox:}
      REDIS_ATTEMPT_LIMIT_KEY_PREFIX: ${REDIS_ATTEMPT_LIMIT_KEY_PREFIX:-limit:}
      MASTER_KEY: ${MASTER_KEY:-dev-only-regenerate-this-key}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:-dev-only-regenerate-this-salt}
      OTP_CHANNEL_MODE: ${OTP_CHANNEL_MODE:-simulated}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-3}
      ALLOW_DEV_OTP_HOOK: ${ALLOW_DEV_OTP_HOOK:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-COP}
      POLICY_SEED_THRESHOLDS_MINOR: '${POLICY_SEED_THRESHOLDS_MINOR:-{"USD": 50000, "EUR": 50000, "BRL": 250000, "COP": 200000000, "ARS": 17795642}}'
      POLICY_SEED_AMOUNT_MODE: ${POLICY_SEED_AMOUNT_MODE:-flag}
      POLICY_SEED_DISABLED_TOOLS: ${POLICY_SEED_DISABLED_TOOLS-account.get_summary}
      POLICY_SEED_HANDOFF_REASONS_REQUIRING_IDENTITY_ATTEMPT: ${POLICY_SEED_HANDOFF_REASONS_REQUIRING_IDENTITY_ATTEMPT-DISPUTE_CLAIM,UNRECOGNIZED_TRANSACTION,VERIFICATION_FAILED}
      # Development defaults: the admin API is on with a public, development-only
      # token so the back office demo steps work with no .env. banking-core refuses
      # to start with this token under APP_ENV=production, and the production
      # override pins these three back to off / empty.
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-true}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-only-admin-token}
      # Only consulted when APP_ENV=production; outside it the fixture reset is
      # always allowed.
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
      TRANSACTION_LIST_MAX_LIMIT: ${TRANSACTION_LIST_MAX_LIMIT:-50}
      RATE_LIMIT_ATTEMPTS_PER_SESSION: ${RATE_LIMIT_ATTEMPTS_PER_SESSION:-5}
      RATE_LIMIT_CUSTOMER_OTP_MAX_FAILURES: ${RATE_LIMIT_CUSTOMER_OTP_MAX_FAILURES:-5}
      RATE_LIMIT_CUSTOMER_OTP_WINDOW_SECONDS: ${RATE_LIMIT_CUSTOMER_OTP_WINDOW_SECONDS:-3600}
      RATE_LIMIT_CUSTOMER_OTP_LOCK_SECONDS: ${RATE_LIMIT_CUSTOMER_OTP_LOCK_SECONDS:-1800}
      RATE_LIMIT_DOCUMENT_MATCH_MAX_FAILURES: ${RATE_LIMIT_DOCUMENT_MATCH_MAX_FAILURES:-10}
      RATE_LIMIT_DOCUMENT_MATCH_WINDOW_SECONDS: ${RATE_LIMIT_DOCUMENT_MATCH_WINDOW_SECONDS:-3600}
      SESSION_LOCK_TTL_MS: ${SESSION_LOCK_TTL_MS:-10000}
      SESSION_LOCK_WAIT_MS: ${SESSION_LOCK_WAIT_MS:-2000}
      AUDIT_HASH_CHAIN_ENABLED: ${AUDIT_HASH_CHAIN_ENABLED:-true}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-vector}
      # The embedding model runs on the model server. banking-core checks that the
      # server reports exactly this model and revision on every answer (the same two
      # variables configure the encoder service).
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-remote}
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-http://encoder:8090}
      MODEL_SERVER_TIMEOUT_SECONDS: ${MODEL_SERVER_TIMEOUT_SECONDS:-10}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ibm-granite/granite-embedding-311m-multilingual-r2}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-44399559930365213510b1ee2eb15ded83374f0e}
      EMBEDDING_DTYPE: ${EMBEDDING_DTYPE:-float32}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_SCORE_FLOOR: ${RETRIEVAL_SCORE_FLOOR:-0.81}
    ports:
      - "127.0.0.1:${PORT_BANKING_CORE:-8081}:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redis-core: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [core, edge]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import json,urllib.request as u; r=json.load(u.urlopen('http://127.0.0.1:8081/health',timeout=3)); raise SystemExit(0 if r.get('status')=='ok' and r.get('service')=='banking-core' else 1)"]
    deploy:
      resources:
        # The embedding model no longer loads here (it was ~1.3 GB, see docs/limitations.md),
        # so this ceiling can be lowered once a Linux measurement exists. EMBEDDING_BACKEND=local
        # needs it.
        limits: { cpus: "1.0", memory: "${BANKING_CORE_MEMORY_LIMIT:-2g}" }

  orchestrator:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: apps/orchestrator/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/orchestrator:dev
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BANKING_CORE_URL: ${BANKING_CORE_URL:-http://banking-core:8081}
      ENCODER_URL: ${ENCODER_URL:-http://encoder:8090}
      ENCODER_ENABLED: ${ENCODER_ENABLED:-true}
      ENCODER_TIMEOUT_SECONDS: ${ENCODER_TIMEOUT_SECONDS:-2}
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-5}
      # ADR-0012: blank = apps/orchestrator/config/decision_effects.yaml (baked into
      # the image, every decision point in shadow); the second is the mode kill switch.
      DECISION_EFFECTS_FILE: ${DECISION_EFFECTS_FILE:-}
      DECISION_POINTS_MODES: ${DECISION_POINTS_MODES:-}
      # Where replay mode reads recordings (mounted below).
      REPLAY_DIR: /app/eval/replay
      REDIS_HOST: redis-edge
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_EDGE_PASSWORD:-dev-only-regenerate-edge-redis}
      REDIS_URL: ${REDIS_EDGE_URL:-}
      REDIS_EDGE_KEY_PREFIX: ${REDIS_EDGE_KEY_PREFIX:-orch:conv:}
      REDIS_EDGE_RATE_LIMIT_KEY_PREFIX: ${REDIS_EDGE_RATE_LIMIT_KEY_PREFIX:-orch:ratelimit:}
      REDIS_EDGE_SESSION_INDEX_KEY_PREFIX: ${REDIS_EDGE_SESSION_INDEX_KEY_PREFIX:-orch:session:}
      # Conversations one client address may open per hour. Generous on purpose:
      # a local session or an evaluation run (one conversation per scenario) comes
      # from one address. The production overlay pins 30 back. Must be >= 1.
      RATE_LIMIT_CONVERSATIONS_PER_IP_HOUR: ${RATE_LIMIT_CONVERSATIONS_PER_IP_HOUR:-1000}
      # The customer path is the web-client BFF, which sends the address of its own
      # connection as X-Forwarded-For: one trusted hop, or every customer would share the
      # BFF's bucket. 8080 is published on loopback only, so nothing but this host can
      # reach the orchestrator directly and send a forged header. The orchestrator's own
      # default stays 0 (no proxy).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Development defaults, as for the admin API above: the agent API (the human
      # takeover, ADR-0013) is on with a public, development-only token. The
      # orchestrator refuses to start with this token under APP_ENV=production, and
      # the production override pins these back to off / empty.
      AGENT_API_ENABLED: ${AGENT_API_ENABLED:-true}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-dev-only-agent-token}
      AGENT_LOCK_WAIT_SECONDS: ${AGENT_LOCK_WAIT_SECONDS:-10}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-regenerate-this-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_LOCK_MARGIN_SECONDS: ${SESSION_LOCK_MARGIN_SECONDS:-60}
      LLM_MODE: ${LLM_MODE:-replay}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_REPLAY_ON_MISS: ${LLM_REPLAY_ON_MISS:-fail}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_HYBRID_ALPHA: ${RETRIEVAL_HYBRID_ALPHA:-0.5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-es,pt,en}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      COST_TRACKING_ENABLED: ${COST_TRACKING_ENABLED:-true}
    volumes:
      # Replay recordings (eval/replay/<key>.json), read-only: recording is a
      # maintainer task run outside the stack, never something the service does.
      - ../../eval/replay:/app/eval/replay:ro
    ports:
      - "127.0.0.1:${PORT_ORCHESTRATOR:-8080}:8080"
    depends_on:
      banking-core: { condition: service_healthy }
      encoder: { condition: service_healthy }
      redis-edge: { condition: service_healthy }
    networks: [edge]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import json,urllib.request as u; r=json.load(u.urlopen('http://127.0.0.1:8080/health',timeout=3)); raise SystemExit(0 if r.get('status')=='ok' and r.get('service')=='orchestrator' else 1)"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  encoder:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: apps/encoder/Dockerfile
      args:
        # `embed` adds PyTorch and sentence-transformers for POST /v1/embed; `gliner` adds
        # PyTorch for ENCODER_BACKEND=gliner (several: "embed gliner"); `hf` adds the
        # fine-tuned DistilBERT decision backend (ADR-0014), whose weights the image
        # copies from its digest-pinned seed image. Empty builds the decision baseline
        # only, and then EMBEDDING_MODEL must be empty and DECISION_POINTS_FILE must name
        # the tfidf_lr artifact.
        ENCODER_EXTRAS: ${ENCODER_EXTRAS-embed hf}
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/encoder:dev
    environment:
      PORT: "8090"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Defaults are the calibrated seed from .env.example (tfidf_lr, tau 0.37), so a
      # stack with no .env can serve chat turns. `-`, not `:-`: a value set to empty
      # still means "no model" / "uncalibrated" (503), as .env.example documents.
      ENCODER_BACKEND: ${ENCODER_BACKEND-tfidf_lr}
      ENCODER_MODEL: ${ENCODER_MODEL:-}
      ENCODER_DEVICE: ${ENCODER_DEVICE:-cpu}
      ENCODER_QUANTIZED: ${ENCODER_QUANTIZED:-true}
      ABSTENTION_THRESHOLD: ${ABSTENTION_THRESHOLD-0.37}
      ENCODER_GLINER_MIN_MEMORY_MB: ${ENCODER_GLINER_MIN_MEMORY_MB:-4096}
      # The embedding model for kb.search (POST /v1/embed), pinned: a full 40-hex commit
      # for a hub model, verified against the cache before it loads. The hash pin is
      # optional and recommended: `make warmup-retrieval` prints it. Empty
      # EMBEDDING_MODEL turns /v1/embed off.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ibm-granite/granite-embedding-311m-multilingual-r2}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-44399559930365213510b1ee2eb15ded83374f0e}
      EMBEDDING_WEIGHTS_SHA256: ${EMBEDDING_WEIGHTS_SHA256:-}
      EMBEDDING_DTYPE: ${EMBEDDING_DTYPE:-float32}
      EMBEDDING_MAX_BATCH: ${EMBEDDING_MAX_BATCH:-64}
      # Decision points (ADR-0012). Default: the pooled DistilBERT artifact (ADR-0014);
      # packages/encoder/calibration/decision_points.json is the tfidf_lr one. Legacy seed
      # mode (ABSTENTION_THRESHOLD) only if no artifact file exists.
      DECISION_POINTS_FILE: ${DECISION_POINTS_FILE:-packages/encoder/calibration/decision_points.distilbert.json}
      # A fixed thread count keeps decisions reproducible (ADR-0012 E.4).
      OMP_NUM_THREADS: ${ENCODER_THREADS:-2}
      DECISION_POINTS_ALLOW_STALE: ${DECISION_POINTS_ALLOW_STALE:-false}
      DECISION_POINTS_TAU_RAISE: ${DECISION_POINTS_TAU_RAISE:-}
    volumes:
      # Model weights cache (HF_HOME=/models/hf) for both models, filled by
      # `make warmup` (decision backend) and `make warmup-retrieval` (embedding model).
      - hf-cache:/models/hf
    ports:
      - "127.0.0.1:${PORT_ENCODER:-8090}:8090"
    networks: [edge]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "python", "-c", "import json,urllib.request as u; r=json.load(u.urlopen('http://127.0.0.1:8090/health',timeout=3)); raise SystemExit(0 if r.get('status')=='ok' and r.get('service')=='encoder' else 1)"]
    deploy:
      resources:
        # tfidf_lr plus the embedding model should fit 3g (estimate; Linux figure pending).
        # ENCODER_BACKEND=gliner peaks at ~3.5 GB RSS alone: set ENCODER_MEMORY_LIMIT=5g
        # with the embedding model.
        limits: { cpus: "2.0", memory: "${ENCODER_MEMORY_LIMIT:-3g}" }

  web-client:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: apps/web-client/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/web-client:dev
    environment:
      PORT: "5173"
      ORCHESTRATOR_URL: http://orchestrator:8080
    ports:
      - "127.0.0.1:${PORT_WEB_CLIENT:-5173}:5173"
    depends_on:
      orchestrator: { condition: service_healthy }
    networks: [edge]
    healthcheck:
      <<: *app-healthcheck
      # The image has no curl. Liveness only: /healthz does not call the orchestrator.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT ?? 5173) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    deploy:
      resources:
        # About 20 MiB at rest, measured on Linux; the rest is headroom.
        limits: { cpus: "0.5", memory: 256m }

  web-backoffice:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: apps/web-backoffice/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-pattern-blue}/web-backoffice:dev
    environment:
      PORT: "5174"
      APP_ENV: ${APP_ENV:-development}
      ORCHESTRATOR_URL: http://orchestrator:8080
      BANKING_CORE_URL: http://banking-core:8081
      # The same variables and development defaults as banking-core (ADMIN_API_TOKEN) and
      # the orchestrator (AGENT_API_TOKEN), so the three sides agree with no .env. Under
      # APP_ENV=production the server refuses to start with any development value below.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-only-admin-token}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-dev-only-agent-token}
      DEMO_AGENT_EMAIL: ${DEMO_AGENT_EMAIL:-agent@demo.local}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-demo-only-change-me}
      BACKOFFICE_SESSION_SECRET: ${BACKOFFICE_SESSION_SECRET:-dev-only-backoffice-session-secret}
    ports:
      - "127.0.0.1:${PORT_WEB_BACKOFFICE:-5174}:5174"
    depends_on:
      banking-core: { condition: service_healthy }
      orchestrator: { condition: service_healthy }
    # banking-core is on edge as well, so edge reaches both upstreams. Not on core: the back
    # office has no business with postgres or redis-core.
    networks: [edge]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT ?? 5174) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    deploy:
      resources:
        # About 20 MiB at rest, measured on Linux; the rest is headroom.
        limits: { cpus: "0.5", memory: 256m }

networks:
  core:
    internal: true
  edge: {}

volumes:
  postgres-data:
  hf-cache:
